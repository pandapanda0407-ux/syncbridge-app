name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist/syncbridge/browser/*
          target: /tmp/syncbridge-deploy
          strip_components: 3

      - name: Upload nginx security headers snippet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/security-headers.conf
          target: /tmp
          strip_components: 1

      - name: Move files and reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/syncbridge/*
            sudo mv /tmp/syncbridge-deploy/* /var/www/syncbridge/

            sudo mkdir -p /etc/nginx/snippets
            sudo mv /tmp/security-headers.conf /etc/nginx/snippets/security-headers.conf

            CONF=$(sudo grep -l "server_name.*syncebridge.com" /etc/nginx/sites-enabled/* 2>/dev/null | xargs -I{} sh -c 'sudo grep -q "listen 443" "{}" && echo "{}"' | head -1)

            if [ -n "$CONF" ] && ! sudo grep -q "security-headers.conf" "$CONF"; then
              sudo cp "$CONF" "$CONF.bak.$(date +%s)"
              sudo sed -i "0,/listen 443/{s|\(listen 443[^;]*;\)|\1\n    include /etc/nginx/snippets/security-headers.conf;|}" "$CONF"
              echo "Wired security-headers.conf into $CONF"
            elif [ -z "$CONF" ]; then
              echo "WARNING: could not locate the TLS server block for syncebridge.com under /etc/nginx/sites-enabled — security headers were NOT applied. Wire /etc/nginx/snippets/security-headers.conf in manually."
            else
              echo "security-headers.conf already included in $CONF, skipping"
            fi

            echo "--- current server config ($CONF) ---"
            sudo cat "$CONF"
            echo "--- end config ---"

            sudo nginx -t && sudo systemctl reload nginx
