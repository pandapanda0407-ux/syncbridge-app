name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist/syncbridge/browser/*
          target: /tmp/syncbridge-deploy
          strip_components: 3

      - name: Upload nginx security headers snippet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/security-headers.conf
          target: /tmp
          strip_components: 1

      - name: Move files and reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/syncbridge/*
            sudo mv /tmp/syncbridge-deploy/* /var/www/syncbridge/

            sudo mkdir -p /etc/nginx/snippets
            sudo mv /tmp/security-headers.conf /etc/nginx/snippets/security-headers.conf

            CONF=/etc/nginx/sites-enabled/syncbridge

            BACKUP="$CONF.bak.$(date +%s)"

            if [ -f "$CONF" ]; then
              sudo cp "$CONF" "$BACKUP"

              cat <<'PYEOF' | sudo tee /tmp/wire-headers.py > /dev/null
            import re

            path = "/etc/nginx/sites-enabled/syncbridge"
            with open(path) as f:
                content = f.read()

            inc = "        include /etc/nginx/snippets/security-headers.conf;\n"

            # A server-level include here never reaches real responses: each
            # location below defines its own add_header directives, and nginx
            # stops inheriting server-level add_header once a location has any
            # of its own. Strip any earlier attempt at a server-level include.
            content = re.sub(r"[ \t]*include /etc/nginx/snippets/security-headers\.conf;[^\n]*\n", "", content)

            # Drop the now-redundant server-level block for the same reason.
            content = re.sub(
                r"[ \t]*# Security headers\n"
                r"[ \t]*add_header X-Frame-Options SAMEORIGIN always;\n"
                r"[ \t]*add_header X-Content-Type-Options nosniff always;\n"
                r"[ \t]*add_header Referrer-Policy strict-origin-when-cross-origin always;\n",
                "",
                content,
            )

            def add_to_location(match):
                block = match.group(0)
                if "security-headers.conf" in block:
                    return block
                idx = block.rfind("}")
                return block[:idx] + inc + block[idx:]

            content = re.sub(r"    location [^{]*\{[^{}]*\}", add_to_location, content)

            # Prerendered routes are written as directories (blog/<slug>/index.html).
            # Against "try_files $uri $uri/ /index.html", nginx matches the directory
            # and answers with a 301 appending a trailing slash, so every URL in the
            # sitemap redirects before it serves — Google reports the lot as "Page
            # with redirect", and each page's canonical then points at a URL that
            # redirects back. "$uri/index.html" serves the file directly instead.
            # Idempotent: once rewritten, the pattern no longer matches.
            before = content
            content = re.sub(
                r"try_files\s+\$uri\s+\$uri/\s+/index\.html\s*;",
                "try_files $uri $uri/index.html /index.html;",
                content,
            )
            print("try_files: rewritten" if content != before else "try_files: already correct")

            # www.syncebridge.com and syncebridge.com both answered 200 with no
            # redirect between them, so the site existed twice as far as Google
            # was concerned — it had indexed the www copy. Collapse www onto the
            # canonical host, which is what every canonical tag already names.
            REDIRECT = "if ($host = www.syncebridge.com) { return 301 https://syncebridge.com$request_uri; }"
            if "www.syncebridge.com" in content and REDIRECT not in content:
                content = re.sub(
                    r"(\n([ \t]*)server_name[^;]*www\.syncebridge\.com[^;]*;\n)",
                    r"\1\n\2# Collapse www onto the canonical host so the site is not indexed twice.\n\2"
                    + REDIRECT.replace("\\", "\\\\")
                    + "\n",
                    content,
                    count=1,
                )
                print("www redirect: added")
            else:
                print("www redirect: already present or no www server_name")

            with open(path, "w") as f:
                f.write(content)
            print("done")
            PYEOF
              sudo python3 /tmp/wire-headers.py
              rm -f /tmp/wire-headers.py
            else
              echo "WARNING: $CONF not found — security headers were NOT applied. Wire /etc/nginx/snippets/security-headers.conf in manually."
            fi

            # Validate before reloading, and put the previous config back if the
            # edits produced anything nginx will not accept.
            if sudo nginx -t; then
              sudo systemctl reload nginx
            else
              echo "ERROR: nginx rejected the edited config — restoring $BACKUP"
              sudo cp "$BACKUP" "$CONF"
              sudo nginx -t && sudo systemctl reload nginx
              exit 1
            fi

            echo "--- verifying headers ---"
            curl -sI https://syncebridge.com/ | grep -iE "content-security-policy|strict-transport-security|x-frame-options|x-content-type-options|referrer-policy" || echo "no security headers found in response"

            echo "--- verifying prerendered routes serve without redirecting ---"
            FAILED=0
            for U in / /blog /services /contact /privacy-policy /integrations/etsy /blog/etsy-seo-guide; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://syncebridge.com$U")
              echo "  $CODE  $U"
              [ "$CODE" = "200" ] || FAILED=1
            done
            [ "$FAILED" = "0" ] && echo "all routes 200" || echo "WARNING: some routes did not return 200"

            echo "--- verifying www redirects to the canonical host ---"
            curl -sI https://www.syncebridge.com/privacy-policy | head -1
            curl -sI https://www.syncebridge.com/privacy-policy | grep -i "^location" || echo "WARNING: www did not redirect"
